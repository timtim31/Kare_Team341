services:

  kafka:
    image: bitnamilegacy/kafka:3.3.2
    container_name: tentacles_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  security_monitor:
    build: .
    container_name: tentacles_security_monitor
    ports:
      - "5001:5001"
    environment:
      - KAFKA_BROKER=kafka:9092
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy
    command: python src/api/monitor_server.py
    volumes:
      - .:/app

  central_system:
    build: .
    container_name: tentacles_central_system
    ports:
      - "5050:5000"
    environment:
      - KAFKA_BROKER=kafka:9092
      - MONITOR_URL=http://security_monitor:5001
      - PYTHONUNBUFFERED=1
    depends_on:
      kafka:
        condition: service_healthy
      security_monitor:
        condition: service_started
    command: python main.py
    volumes:
      - .:/app